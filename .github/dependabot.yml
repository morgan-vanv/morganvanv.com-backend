# Weekly, grouped update PRs: the workflows' pinned actions and the three Workers' npm packages (dev tools only:
# no Worker has runtime dependencies). wrangler and @cloudflare/* group first ("cloudflare", merged by a person,
# since wrangler builds and deploys); the rest of the dev dependencies are "dev-tools", which merge themselves
# when green, as do Actions updates (.github/workflows/dependabot-auto-merge.yml).
# Each waits a week after a release (security updates don't), so a hijacked version is usually gone first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /campfire
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Wrangler and the Vitest plugin pin the same Miniflare, so they move together.
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      dev-tools:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ask
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Wrangler and the Vitest plugin pin the same Miniflare, so they move together.
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      dev-tools:
        dependency-type: development
        patterns: ['*']

  - package-ecosystem: npm
    directory: /lab-status
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Wrangler and the Vitest plugin pin the same Miniflare, so they move together.
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      dev-tools:
        dependency-type: development
        patterns: ['*']
